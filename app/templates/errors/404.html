{% extends "base.html" %}

{% block title %}Page Not Found — SkillSwap{% endblock %}

{% block content %}
<div class="container text-center py-5">
  <div class="my-4">
    <div class="display-1 fw-bold text-primary mb-2">404</div>
    <h2 class="fw-bold mb-3">Page Not Found</h2>
    <p class="text-muted lead max-w-md mx-auto mb-4">
      The skill exchange room or resource you are looking for has moved or does not exist.
    </p>
    <div class="d-flex justify-content-center gap-3">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary px-4 py-2">
        <i class="bi bi-house me-1"></i> Return Home
      </a>
      <a href="{{ url_for('skills.index') }}" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-grid me-1"></i> Explore Skills
      </a>
    </div>
  </div>
</div>
{% endblock %}
